name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The solver, piece set and simulator are pure Python + NumPy; the
      # screen-capture and mouse modules are Windows-only and not imported.
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
